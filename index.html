<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Takeout Banani — Digital Menu</title>
    <meta name="description" content="Takeout Banani Digital Menu — Bangladesh's Biggest Burger Brand. Browse our menu of burgers, fries, shakes and more." />
    <meta name="keywords" content="burger, fast food, Bangladesh, menu, takeout, restaurant" />
    <meta name="author" content="Takeout Banani" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1a1a1a" />
    
    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Google Fonts with preload -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Takeout Banani" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="Takeout Banani — Digital Menu" />
    <meta property="og:description" content="Bangladesh's #1 Burger Brand. Browse our menu of burgers, fries, shakes and more." />
    <meta property="og:type" content="restaurant.menu" />
    <meta property="og:url" content="https://takeoutbanani.com" />
    <meta property="og:image" content="https://takeoutbanani.com/og-image.jpg" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Takeout Banani — Digital Menu" />
    <meta name="twitter:description" content="Bangladesh's #1 Burger Brand. Browse our menu of burgers, fries, shakes and more." />
    <meta name="twitter:image" content="https://takeoutbanani.com/og-image.jpg" />
    
    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Restaurant",
      "name": "Takeout Banani",
      "description": "Bangladesh's Biggest Burger Brand",
      "url": "https://takeoutbanani.com",
      "sameAs": [
        "https://www.facebook.com/takeoutbanani",
        "https://www.instagram.com/takeoutbanani"
      ]
    }
    </script>
    
    <style>
      html, body { 
        margin: 0; 
        padding: 0; 
        width: 100%; 
        min-height: 100%; 
        background: #080808;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #root { min-height: 100vh; }
      /* Prevent FOUC */
      body { opacity: 0; animation: bodyFadeIn 0.3s 0.1s forwards; }
      @keyframes bodyFadeIn { to { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
